<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax responsive landing page</title>

    <!-- MAIN STYLES -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/mountain-parallax.css" />

    <!-- ICONS BOXICONS -->
    <link
      href="https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css"
      rel="stylesheet"
    />

    <!-- OVERRIDE: 讓預覽圖正常滿版顯示，不要被擠到右邊 -->
    <style>
      .mountain-section {
        position: relative;
        overflow: hidden;
      }

      .mountain-image {
        position: static !important;
        width: 100%;
        height: auto;
        object-fit: cover;
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <!-- ===== HEADER =====-->
    <header class="l-header">
      <nav class="nav bd-grid">
        <a href="#" class="nav__logo">Mountain</a>

        <div class="nav__toggle" id="nav-toggle">
          <i class="bx bx-menu-alt-right"></i>
        </div>

        <div class="nav__menu" id="nav-menu">
          <ul class="nav__list">
            <li class="nav__item">
              <a href="#" class="nav__link">Home</a>
            </li>
            <li class="nav__item">
              <a href="#section" class="nav__link">Explore</a>
            </li>
            <li class="nav__item">
              <a href="#section" class="nav__link">Adventure</a>
            </li>
            <li class="nav__item">
              <a href="#section" class="nav__link">Discover</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <!-- ===== HOME / HERO =====-->
      <div class="home">
        <!-- Parallax background layers -->
        <div
          class="parallax home__parallax home__parallax-img1"
          data-rellax-speed="-9"
        ></div>
        <div
          class="parallax home__parallax home__parallax-img2"
          data-rellax-speed="-7"
        ></div>
        <div
          class="parallax home__parallax home__parallax-img3"
          data-rellax-speed="-6"
        ></div>
        <div
          class="parallax home__parallax home__parallax-img4"
          data-rellax-speed="-3"
        ></div>

        <!-- 主視覺圖片：使用專案根目錄的 preview.png -->
        <div class="mountain-section">
          <img
            src="preview.png"
            class="parallax mountain-image"
            alt="Mountains"
            data-rellax-speed="-4"
          />
        </div>

        <h1 class="parallax home__title" data-rellax-speed="-6">Mountain</h1>
        <span class="parallax home__subtitle" data-rellax-speed="-5">
          Mountain explore
        </span>

        <div class="home__scroll">
          <a href="#section"><i class="bx bx-mouse"></i></a>
        </div>
      </div>
