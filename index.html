<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parallax responsive landing page</title>

        <link rel="stylesheet" href="assets/css/styles.css">
        <link rel="stylesheet" href="assets/css/mountain-parallax.css">

        <!-- ICONS BOXICONS -->
        <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>

        <style>
            /* 讓標題看起來更清楚 */
            .home__title {
                text-shadow: 0px 0px 25px rgba(0,0,0,0.6);
            }

            .home__subtitle {
                text-shadow: 0px 0px 15px rgba(0,0,0,0.6);
            }

            /* 移除滑鼠符號 */
            .home__scroll {
                display: none !important;
            }
        </style>

    </head>
    <body>
        <!-- ===== HEADER =====-->
        <header class="l-header">
            <nav class="nav bd-grid">
                <a href="#" class="nav__logo">Mountain</a>

                <div class="nav__toggle" id="nav-toggle">
                    <i class='bx bx-menu-alt-right'></i>
                </div>

                <div class="nav__menu" id="nav-menu">
                    <ul class="nav__list">
                        <li class="nav__item"><a href="#" class="nav__link">Home</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Explore</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Aventure</a></li>
                        <li class="nav__item"><a href="#" class="nav__link">Discover</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <!-- ===== HOME =====-->
            <div class="home">

                <!-- 使用你的山景照作為背景 -->
                <div class="mountain-section">
                    <img src="preview.png" class="parallax mountain-image" alt="Mountains" data-rellax-speed="-4">
                </div>

                <h1 class="parallax home__title" data-rellax-speed="-6">Mountain</h1>
                <span class="parallax home__subtitle" data-rellax-speed="-5">Mountain explore</span> 

            </div>

            <!-- ===== SECTION =====-->
            <section class="l-section" id="section">

                <div class="section mountain-section">
                    <img src="preview.png" alt="Mountains" class="mountain-image">

                    <div class="section text">
                        <div class="section__data">
                            <h2 class="section__title">Scaling mountains</h2>
                            <p class="section__text">
                                Discover nature through its majestic peaks. 
                                A breathtaking journey into the heart of the mountains.
                            </p>
                        </div>
        
                        <img src="assets/img/imgm.jpg" alt="" class="section__img">
                    </div>

                </div>

            </section>
        </main>

        <!-- RELLAX JS -->
        <script src="assets/js/rellax.min.js"></script>

        <!-- GSAP -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.2.6/gsap.min.js"></script>

        <!-- SCROLL REVEAL -->
        <script src="https://unpkg.com/scrollreveal"></script>

        <!-- MAIN JS -->
        <script src="assets/js/main.js"></script>
        
        <!-- MOUNTAIN PARALLAX JS -->
        <script src="assets/js/mountain-parallax.js"></script>

    </body>
</html>
